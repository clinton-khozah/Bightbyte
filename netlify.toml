[build]
  command = "npm ci && npm --prefix server ci && npm --prefix client ci && npm --prefix client run build"
  publish = "client/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_STORAGE_BUCKET,APP_LOGIN_URL,CLIENT_ORIGIN,EMAILJS_TEMPLATE_ID"

[functions]
  node_bundler = "esbuild"
  included_files = ["server/src/**"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "/.netlify/functions/api/uploads/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
